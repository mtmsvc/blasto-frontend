# Runs on every push and pull request. A red ✗ on GitHub means something
# broke; open the run to see which check failed.
name: CI

on:
  push:
  pull_request:

jobs:
  checks-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Types, lint, formatting, color contrast
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # Builds the site and runs every browser test
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Makes sure the production image still builds.
      - run: docker build -t blasto-frontend .
